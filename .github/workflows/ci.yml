name: CI

on:
  push:
    # dev = default branch (latest playable build), main = stable branch merged by Max.
    # claude/** = branches pushed by Claude Code; automerge.yml merges them into dev when this passes.
    branches: [main, dev, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: tests run locally
    # #237, Max (2026-11-11): « fais tous tes tests en local, rien sur la CI ».
    # fmt, clippy, cargo test and the wasm check run on the machine before each push
    # (CLAUDE.md, step 4). This job only marks the push so automerge.yml merges the branch.
    if: github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests run locally before the push (CLAUDE.md, step 4; #237)."

  deploy:
    name: Build web + deploy to GitHub Pages
    # Deploys the default branch (dev): the latest build, to play-test Claude's work.
    # No `needs: check` (#237): the tests already passed on the branch merged into dev.
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install trunk
        run: |
          curl -sSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv trunk /usr/local/bin/
      - name: Build
        run: trunk build --release --public-url "/${{ github.event.repository.name }}/"
      - name: Report wasm size
        run: ls -lh dist/*.wasm
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
