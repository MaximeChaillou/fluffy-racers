[package]
name = "fluffy-racers"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bevy = "0.20"

# Compile dependencies with optimizations even in dev: Bevy is very slow otherwise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
# Bevy systems routinely take many parameters and complex query types.
type_complexity = "allow"
too_many_arguments = "allow"
