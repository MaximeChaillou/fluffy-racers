[package]
name = "fluffy-racers"
version = "0.1.0"
edition = "2024"
publish = false
# Issue #225: `cargo run` is the game (the dedicated server: `--bin fluffy-racers-server`).
default-run = "fluffy-racers"

[dependencies]
bevy = "0.20"
# Collisions and ground contact only: kart feel comes from our own curves (docs/ARCHITECTURE.md).
bevy_rapier3d = { version = "0.37", default-features = false, features = ["dim3"] }
# Circuit files (assets/tracks/*.track.ron). Both are already compiled for Bevy's own assets
# (same versions), so they add nothing to the build.
ron = "0.12"
serde = { version = "1", features = ["derive"] }
# Admin panel (issue #36): egui over the game, only while the panel is open. Without its default
# `open_url` (no link to open) and `picking` (the game does not use bevy_picking) features;
# `manage_clipboard` is what lets "Copier" and Cmd+V work, in the browser too.
bevy_egui = { version = "0.43", default-features = false, features = [
    "render",
    "bevy_ui",
    "default_fonts",
    "manage_clipboard",
] }
# Network (issue #7): WebRTC peer-to-peer, full mesh, used directly (`bevy_matchbox` does not
# support Bevy 0.20). Planned in the stack (CLAUDE.md). Natively it brings webrtc-rs (and rustls,
# tokio, async-std); in the browser only a few small crates over the browser's own WebRTC.
matchbox_socket = "0.14"
# Issue #49: our own signaller around matchbox's (`net/signaling.rs`), to see what goes through the
# signaling server (peers announced, offers and their ICE candidates). The same crates, versions
# and features as matchbox_socket's own signaller: nothing more is compiled.
serde_json = { version = "1", default-features = false, features = ["alloc"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
futures-timer = { version = "3", default-features = false }
# A random room code (« Créer une partie »). Already compiled for bevy_egui, on both targets.
getrandom = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Issue #225: the dedicated server embeds its signaling (`net/signal_server.rs`): the same server
# as `matchbox_server` (its crate, the same version as matchbox_socket's protocol), so nothing has
# to run beside it. Native only: never in the wasm build. It adds axum, hyper and tower-http to
# the native build (tokio is already there, for matchbox_socket's WebRTC).
matchbox_signaling = "0.14"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time"] }
# Issue #49: matchbox_socket's WebSocket natively (see `serde_json` above).
async-tungstenite = { version = "0.32", default-features = false, features = [
    "async-std-runtime",
    "async-tls",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Issue #49: matchbox_socket's WebSocket in the browser, and its timers (see `serde_json` above).
ws_stream_wasm = { version = "0.7", default-features = false }
futures-timer = { version = "3", default-features = false, features = ["wasm-bindgen"] }
# Already compiled for Bevy (winit, wgpu): the admin panel only adds the browser's local storage
# (its settings survive a reload) and the page address (`?admin`).
# Issue #7: the page's `History` puts `?room=CODE` in the address bar.
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "History"] }
# getrandom asks the browser (`crypto.getRandomValues`); bevy_egui already enables it.
getrandom = { version = "0.4", features = ["wasm_js"] }
# Already compiled for Bevy (bevy_winit), no feature added: while the panel's text field has the
# keyboard, the browser handles the keys again (Cmd+V pastes, Cmd+C copies).
winit = { version = "0.30", default-features = false }

# Issue #225: the dedicated server, without a window (`docs/SERVEUR.md`). No test harness of its
# own (its logic is the library's, tested there): one big test binary less to link.
[[bin]]
name = "fluffy-racers-server"
path = "src/bin/server.rs"
test = false

# Compile dependencies with optimizations even in dev: Bevy is very slow otherwise.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lints.clippy]
# Bevy systems routinely take many parameters and complex query types.
type_complexity = "allow"
too_many_arguments = "allow"
